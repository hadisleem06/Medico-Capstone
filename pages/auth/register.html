<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Medico</title>

<link rel="stylesheet" href="../assets/css/auth/register.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<!-- Background -->

<div class="background">


    <div class="blob blob-one"></div>

    <div class="blob blob-two"></div>

    <div class="blob blob-three"></div>


    <div class="medical-icons">

        <span>🧬</span>
        <span>⚕️</span>
        <span>🩺</span>
        <span>🧫</span>
        <span>💊</span>
        <span>🧠</span>
        <span>❤️</span>

    </div>


</div>



<nav>


<div class="logo">

🩺 Medico

</div>



<a href="../index.html">

<i class="fa-solid fa-arrow-left"></i>

Back Home

</a>


</nav>





<main class="register-container">



<div class="register-card">



<div class="brand">

<span>

AI POWERED HEALTHCARE

</span>

</div>




<h1>

Create Account

</h1>



<p>

Join Medico and experience intelligent healthcare.

</p>





<form id="registerForm" novalidate>



<div class="field">

<div class="input-box">


<i class="fa-solid fa-user"></i>


<input

type="text"

id="name"

placeholder="Full Name"

>


</div>

</div>





<div class="field">

<div class="input-box">


<i class="fa-solid fa-envelope"></i>


<input

type="email"

id="email"

placeholder="Email Address"

>


</div>

</div>





<div class="field">

<div class="input-box">


<i class="fa-solid fa-phone"></i>


<input

type="text"

id="phone"

placeholder="Phone Number"

>


</div>

</div>





<div class="field">

<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input

type="password"

id="password"

placeholder="Password"

>


<i class="fa-solid fa-eye toggle-password"></i>


</div>

</div>






<div class="field">

<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input

type="password"

id="confirmPassword"

placeholder="Confirm Password"

>


</div>

</div>





<div class="role-selection">


<p>

I am a:

</p>


<label>

<input type="radio" name="role" value="patient">

Patient

</label>


<label>

<input type="radio" name="role" value="doctor">

Doctor

</label>



</div>







<button class="register-btn">


Create Account

<i class="fa-solid fa-arrow-right"></i>


</button>




</form>






<div class="divider">

<span>

OR

</span>

</div>





<p class="login-link">


Already have an account?


<a href="login.html">

Login

</a>


</p>





<div class="security">


<i class="fa-solid fa-shield-halved"></i>


Protected by AI Security


</div>




</div>


</main>





<script src="../assets/js/register.js"></script>


</body>

</html>
